# Spring Modulith's event publication registry (the transactional outbox), as in
# spring-modulith-events-jdbc 2.1.2 schema-postgresql.sql. With completion-mode: archive, a
# completed publication is deleted from event_publication and inserted into
# event_publication_archive, so the first table stays at the size of the in-flight work. The
# archive carries no indexes: it is written once per completed publication and read only by
# support queries, and retention is handled by dropping partitions rather than by deleting rows.
databaseChangeLog:
  - changeSet:
      id: 006-event-publication
      author: nox
      changes:
        - createTable:
            tableName: event_publication
            columns: &publicationColumns
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: listener_id, type: text, constraints: { nullable: false } }
              - column: { name: event_type, type: text, constraints: { nullable: false } }
              - column: { name: serialized_event, type: text, constraints: { nullable: false } }
              - column: { name: publication_date, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: completion_date, type: timestamp with time zone }
              - column: { name: status, type: text }
              - column: { name: completion_attempts, type: int }
              - column: { name: last_resubmission_date, type: timestamp with time zone }
        - sql:
            sql: create index event_publication_serialized_event_hash_idx on event_publication using hash (serialized_event)
        - createIndex:
            tableName: event_publication
            indexName: event_publication_by_completion_date_idx
            columns:
              - column: { name: completion_date }
        - createTable:
            tableName: event_publication_archive
            columns: *publicationColumns
      rollback:
        - dropTable: { tableName: event_publication_archive }
        - dropTable: { tableName: event_publication }
