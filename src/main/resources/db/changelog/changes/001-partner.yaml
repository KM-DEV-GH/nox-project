# Partner master data and its append-only audit (data-model.md: Partner, PartnerHistoryEntry).
databaseChangeLog:
  - changeSet:
      id: 001-partner
      author: nox
      changes:
        - createTable:
            tableName: partner
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: client_id, type: varchar(255), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_partner_client_id } }
              - column: { name: name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: website, type: varchar(2048) }
              - column: { name: status, type: varchar(32), constraints: { nullable: false } }
              - column: { name: valid_from, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: valid_to, type: timestamp with time zone }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, constraints: { nullable: false } }
        - sql:
            sql: >-
              alter table partner add constraint ck_partner_status
              check (status in ('ACTIVE', 'SUSPENDED', 'DEREGISTERED'))
      rollback:
        - dropTable: { tableName: partner }
  - changeSet:
      id: 001-partner-history
      author: nox
      changes:
        - createTable:
            tableName: partner_history
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: partner_id, type: uuid, constraints: { nullable: false, foreignKeyName: fk_partner_history_partner, references: partner(id) } }
              - column: { name: field, type: varchar(64), constraints: { nullable: false } }
              - column: { name: old_value, type: varchar(2048) }
              - column: { name: new_value, type: varchar(2048), constraints: { nullable: false } }
              - column: { name: changed_by, type: varchar(255), constraints: { nullable: false } }
              - column: { name: occurred_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: reason, type: varchar(1024) }
        - createIndex:
            tableName: partner_history
            indexName: ix_partner_history_partner
            columns:
              - column: { name: partner_id }
      rollback:
        - dropTable: { tableName: partner_history }
