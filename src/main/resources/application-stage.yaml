# Auth values have no defaults here: NOX_AUTH_ISSUER_URI and NOX_AUTH_JWKS_URI must be set.
# Likewise NOX_DB_URL, NOX_RABBITMQ_HOST, the NOX_OWL_* settings, and NOX_PAYMENT_CORE_BASE_URL,
# NOX_PAYMENT_CORE_TOKEN_URI, NOX_PAYMENT_CORE_CLIENT_ID, NOX_PAYMENT_PAYIN_METHOD and
# NOX_PAYMENT_PAYOUT_METHOD, plus the secrets NOX_DB_PASSWORD, NOX_RABBITMQ_PASSWORD,
# NOX_OWL_CLIENT_SECRET, NOX_OWL_API_KEY and NOX_PAYMENT_CORE_CLIENT_SECRET.
nox:
  service:
    environment: stage
