spring:
  datasource:
    url: ${NOX_DB_URL:jdbc:postgresql://localhost:5432/nox}
  liquibase:
    contexts: schema,dev
  rabbitmq:
    host: ${NOX_RABBITMQ_HOST:localhost}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

nox:
  service:
    environment: dev
  auth:
    issuer-uri: ${NOX_AUTH_ISSUER_URI:http://localhost:8180/realms/nox-dev}
    jwks-uri: ${NOX_AUTH_JWKS_URI:http://localhost:8180/realms/nox-dev/protocol/openid-connect/certs}
  payment:
    # Payment-core is an external service: NOX_PAYMENT_CORE_* and NOX_PAYMENT_*_METHOD come from .env.
    payment-core:
      base-url: ${NOX_PAYMENT_CORE_BASE_URL:http://localhost:8280}
