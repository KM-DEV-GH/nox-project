openapi: 3.1.0
info:
  title: Nox API — Authentication & Caller Identity
  version: 1.0.0
  description: |
    Headless API. Every endpoint except /healthz and /readyz requires an OAuth 2.0 Bearer
    access token issued by the configured Keycloak realm, with this service ("nox-api") in its
    audience. Errors use application/problem+json with the project's standard fields.

    Error catalogue (constitution Principle VI) — every API endpoint may return:
    401 unauthenticated, 404 not_found (unknown path, authenticated callers only),
    405 method_not_allowed, 406 not_acceptable, 500 internal_error,
    503 identity_provider_unavailable. Role-restricted endpoints may also return
    403 forbidden. Responses are defined under components/responses.
servers:
  - url: http://localhost:8080
security:
  - keycloakBearer: []
paths:
  /api/v1/me:
    get:
      operationId: getCurrentCaller
      summary: Return the identity of the authenticated caller
      description: |
        Returns only the requesting caller's own identity, derived from the validated token.
        No role is required. Never returns the token or claims beyond those listed.
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCallerResponse"
              examples:
                user:
                  value:
                    data:
                      subjectId: 3f6c1a2e-6b1d-4c1e-9a77-0d6f7c2b9e11
                      callerType: USER
                      username: alice
                      clientId: null
                      email: alice@example.test
                      roles: [nox-tester]
                    meta:
                      traceId: a0b3dd10e3be3097d588b6c3ccd7f4c0
                      timestamp: "2026-10-25T09:21:41.942967Z"
                      instance: /api/v1/me
                service:
                  value:
                    data:
                      subjectId: 9b2d7e40-1c3a-4f5e-8d21-6a0c4b7f3e22
                      callerType: SERVICE
                      username: null
                      clientId: nox-test-client
                      email: null
                      roles: []
                    meta:
                      traceId: 5e1b8c0d2f3a4b6c7d8e9f0a1b2c3d4e
                      timestamp: "2026-10-25T09:21:42.012345Z"
                      instance: /api/v1/me
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /healthz:
    get:
      operationId: getHealth
      summary: Service health (knowledge-base health contract)
      security: []
      responses:
        "200":
          description: UP or DEGRADED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: DOWN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: 200 once the realm signing keys have been loaded at least once; 503 before. No body.
      security: []
      responses:
        "200":
          description: Ready (no body)
        "503":
          description: Not ready (no body)
components:
  securitySchemes:
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthenticated:
      description: Missing or invalid token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:problem:unauthenticated
            title: unauthenticated
            detail: A valid access token is required.
            traceId: 4574352eb5bf4d5d80c376a1d172b868
            timestamp: "2026-10-25T09:21:41.942967Z"
            instance: /api/v1/me
    Forbidden:
      description: Valid token, but a required role is missing
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:problem:forbidden
            title: forbidden
            detail: You do not have permission to perform this action.
            traceId: 4574352eb5bf4d5d80c376a1d172b868
            timestamp: "2026-10-25T09:21:41.942967Z"
            instance: /api/v1/example
    NotFound:
      description: No resource exists at this path (authenticated callers only; unauthenticated callers get 401)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:problem:not_found
            title: not_found
            detail: The requested resource was not found.
            traceId: 4574352eb5bf4d5d80c376a1d172b868
            timestamp: "2026-10-25T09:21:41.942967Z"
            instance: /api/v1/does-not-exist
    MethodNotAllowed:
      description: The HTTP method is not supported for this resource
      headers:
        Allow:
          description: Supported methods
          schema:
            type: string
            example: GET
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:problem:method_not_allowed
            title: method_not_allowed
            detail: The HTTP method is not supported for this resource.
            traceId: 4574352eb5bf4d5d80c376a1d172b868
            timestamp: "2026-10-25T09:21:41.942967Z"
            instance: /api/v1/me
    NotAcceptable:
      description: None of the media types in the Accept header can be produced
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:problem:not_acceptable
            title: not_acceptable
            detail: The requested media type is not supported.
            traceId: 4574352eb5bf4d5d80c376a1d172b868
            timestamp: "2026-10-25T09:21:41.942967Z"
            instance: /api/v1/me
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:problem:internal_error
            title: internal_error
            detail: An unexpected error occurred. Please retry later.
            traceId: 4574352eb5bf4d5d80c376a1d172b868
            timestamp: "2026-10-25T09:21:41.942967Z"
            instance: /api/v1/me
    IdentityProviderUnavailable:
      description: The token's signing key could not be obtained from the identity provider
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: urn:problem:identity_provider_unavailable
            title: identity_provider_unavailable
            detail: Authentication is temporarily unavailable. Please retry later.
            traceId: 4574352eb5bf4d5d80c376a1d172b868
            timestamp: "2026-10-25T09:21:41.942967Z"
            instance: /api/v1/me
  schemas:
    Meta:
      type: object
      required: [traceId, timestamp, instance]
      properties:
        traceId: { type: string, pattern: "^[0-9a-f]{32}$" }
        timestamp: { type: string, format: date-time }
        instance: { type: string, description: Request path }
    CallerIdentity:
      type: object
      required: [subjectId, callerType, username, clientId, email, roles]
      properties:
        subjectId: { type: string }
        callerType: { type: string, enum: [USER, SERVICE] }
        username: { type: [string, "null"], description: Set for USER, null for SERVICE }
        clientId: { type: [string, "null"], description: Set for SERVICE, null for USER }
        email: { type: [string, "null"], format: email }
        roles:
          type: array
          uniqueItems: true
          items: { type: string }
    CurrentCallerResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/CallerIdentity" }
        meta: { $ref: "#/components/schemas/Meta" }
    Problem:
      type: object
      required: [type, title, detail, traceId, timestamp, instance]
      properties:
        type: { type: string, pattern: "^urn:problem:[a-z_]+$" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string, pattern: "^[0-9a-f]{32}$" }
        timestamp: { type: string, format: date-time }
        instance: { type: string }
      additionalProperties: true
    Health:
      type: object
      required: [status, serviceId]
      properties:
        status: { type: string, enum: [UP, DOWN, DEGRADED] }
        serviceId: { type: string, const: nox }
        description: { type: string }
        version: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [componentId, componentType, status, time]
            properties:
              componentId: { type: string, examples: [keycloak] }
              componentType:
                type: string
                enum: [redis, postgresql, mongodb, rabbitmq, external-service]
              status: { type: string, enum: [UP, DOWN, DEGRADED] }
              time: { type: string, format: date-time }
